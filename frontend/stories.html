<!DOCTYPE html>
<html>
<head>
    <title>Stories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .story {
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
        }
        .story h3 {
            margin: 0;
            color: #2c3e50;
        }
        .story p {
            margin: 5px 0 0;
            color: #555;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>📚 All Stories</h1>
    <div id="stories"></div>
    <a href="index.html">← Back to Home</a>

    <script>
        async function fetchStories() {
            const container = document.getElementById('stories');
            container.textContent = 'Loading stories...';
            try {
                const res = await fetch('http://localhost:3000/api/stories');
                const stories = await res.json();
                container.innerHTML = stories.map(story => `
                    <div class="story">
                        <h3>${story.title}</h3>
                        <p>${story.content}</p>
                    </div>
                `).join('');
            } catch (error) {
                container.textContent = 'Error loading stories.';
            }
        }
        fetchStories();
    </script>
</body>
</html>
